name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        node-version: [18, 20, 22]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate plugin manifest
        run: npm run lint:plugin

      - name: Lint frontmatter
        run: npm run lint:frontmatter

      - name: Check skill drift
        run: npm run build:skills:check

      - name: Check role/rule drift
        run: node scripts/check-drift.mjs

      - name: Preflight
        run: node scripts/preflight.mjs

      - name: Run script tests
        run: npm test

      - name: Migration test harness
        run: node scripts/migrations/test-harness.mjs

      - name: CI lint — no ./scripts paths in hooks.json
        shell: bash
        run: |
          if grep -E '"command":\s*"node \./scripts' hooks/hooks.json; then
            echo "ERROR: hooks.json uses ./scripts — use \${CLAUDE_PLUGIN_ROOT}/scripts (Round 6 #88)"
            exit 1
          fi
